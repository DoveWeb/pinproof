name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (Ruff)
        run: pip install ruff && ruff check .
      - name: Selftest (positive and negative controls)
        shell: bash
        run: PIN_DIR="$(mktemp -d)" python pinproof.py selftest
      - name: Tests (CI gate)
        run: python -m unittest discover tests
